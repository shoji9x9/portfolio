# Dependabot による依存更新設定。
#
# 注意: mise（mise.toml）で管理するツール
#   node / pnpm / gitleaks / actionlint / ghalint / pinact / shfmt / shellcheck /
#   wrangler / viteplus
# は Dependabot がネイティブに扱えない（対応エコシステムに mise が無いため）。
# これらの更新は `mise outdated` / `mise up` で手動管理し、本設定の対象外とする。
version: 2
updates:
  # ---------------------------------------------------------------------------
  # pnpm 依存（package.json / pnpm-lock.yaml）
  # Dependabot は pnpm を "npm" エコシステムとして解釈する。
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    # Conventional Commits に合わせた commit message prefix。
    commit-message:
      prefix: "chore(deps)" # 本体依存 -> "chore(deps): ..."
      prefix-development: "chore(deps-dev)" # devDependencies -> "chore(deps-dev): ..."
    # サプライチェーン対策: 公開直後のリリース採用を遅延させる
    # （mise の minimum_release_age / pnpm の minimumReleaseAge と方針を揃える）。
    cooldown:
      default-days: 7
    ignore:
      # inter-ui は本文フォントの送り幅を現行サイトと一致させるため 3.19.3 に完全固定している
      # （skills.yml の intentional_diffs.keep「本文フォントの字形・送り幅」）。4.x は字形・
      # メトリクスが変わり、.replace/parity/*/baseline/ のピクセルベースライン（ノイズ基準値は
      # pixel_diff: 0）が無効になる。CI は Playwright を実行しないためこの回帰は検出できない。
      # 上げるには意図的差異レジストリの方針変更とベースライン再採取が要るので、メジャーは出さない。
      - dependency-name: "inter-ui"
        update-types:
          - "version-update:semver-major"
      # @types/node は**意図的に ignore しない**。実行環境（mise.toml の node）と対で上げる
      # 必要がある依存だが、ignore すると Dependabot が沈黙する。mise 管理ツール側の通知は
      # outdated.yml が担うので、両側から通知が来る状態を保ち、整合そのものは CI の
      # `pnpm check:node-version` で機械的に落とす（scripts/node-version-parity.ts。Issue #45）。
      # 検査は「メジャーの一致」と「型の minor が実行環境の minor を超えない」の両方を見る。
      # 後者が要るのは dependabot-automerge.yml が semver-minor を自動マージ対象にしているため
      # （型だけ先の minor へ進むと、実行環境に無い API が型検査を通る。実測は
      # docs/quality-checks.md「3 を等値ではなく片側にする理由」）。
      # 型が先行する PR が来たら単独でマージせず、mise.toml の node 更新を同じ PR に足す。
      # @voidzero-dev/vite-plus-core は ignore する。package.json の `vite` はこのパッケージへの
      # エイリアス（npm:@voidzero-dev/vite-plus-core@<mise.toml の viteplus と同一版>）。
      # Dependabot がエイリアスをどう扱うかは版・experiment 依存で、実測していない。
      # 一次情報（dependabot-core の npm_and_yarn/lib/dependabot/npm_and_yarn/file_parser.rb）:
      #   - 既定経路では `ignore_requirement?` が `npm:` で始まる requirement を落とすため、
      #     エイリアス依存は実名でもエイリアス名でも拾われず、PR は作られない。
      #   - 実名へ解く経路（`dealias_package`）は `dealias_packages?`
      #     = `options.fetch(:dealias_packages, false)` の後ろにあり、既定は false。
      #     GitHub 側がこの experiment を有効にすれば実名 = このパッケージ名で PR が作られる。
      # つまり本エントリは「解く経路が有効な場合」に効く保険であり、無効なら no-op。
      # 保険が要るのは、対になる vp CLI が mise 管理で Dependabot が触れないため、単独更新は
      # 「リリースされていない CLI 版 × core 版」になり、vp dev / build / preview が
      # 厳密一致チェックで落ちる（上流 voidzero-dev/vite-plus#2356 の「bot が lockstep を壊す」構図）。
      # 沈黙対策: 更新通知は outdated.yml（mise の viteplus）が担い、そこで両方を同じコミットで
      # 上げる。ずれたまま進んだ場合は CI の Build（`vp build`）が必ず落ちる。
      - dependency-name: "@voidzero-dev/vite-plus-core"
    groups:
      # playwright 系は**必ず同時に**上げる。片方だけ上げると型検査が壊れる。
      #   - e2e/parity/lib/capture.ts は Locator を "@playwright/test" から取る
      #   - e2e/parity/lib/tools/vendor/trait-capture.mjs は JSDoc の
      #     `import('playwright').Locator` から取る（parity-suite 配布物。修正しない規約）
      #   - capture.ts が前者の値を後者の関数へ渡すため、両者の Locator が同一型である必要がある
      # @playwright/test は playwright を、playwright は playwright-core を厳密固定（^ なし）で
      # 要求するので、版がずれると playwright-core が 2 系統同居し Locator が非互換になる。
      # 実測（2026-08-03, PR #38 / #42）: 片方だけの更新は TS2345 / TS2322 で必ず落ちる。
      # グループの振り分けは設定の並び順ではなく Dependabot が判定する「具体性」で決まる。
      # 実測（2026-09-19, Dependabot run 35440215401）: パッケージ名をそのまま書いたグループ
      # （playwright / react / vitest 本体）は patch に勝ったが、`@vitest/*` や `@tailwindcss/*` の
      # ワイルドカード指定は `belongs to more specific group 'patch'` で patch に負け、
      # @vitest/coverage-v8 だけが vitest のメジャー更新 PR（#121）から漏れた。
      # 一次情報（dependabot-core の updater/lib/dependabot/updater/pattern_specificity_calculator.rb、
      # b74d9cf 時点）: 完全名一致は 1000 点で他グループと比較されない。ワイルドカードは
      # 100 - 10×`*` の数 + (長さ - 5) 点（`@vitest/*` は 94 点）で、patterns を持たない patch（500 点）に負ける。
      # そのため lockstep グループの patterns は**ワイルドカードを使わず完全名で列挙**する。
      # 対象の依存を追加したら、ここにも名前を足す。
      # なお、万一片方だけの PR が現れたら**単独でマージしない**。もう片方を同じ PR に足す。
      playwright:
        patterns:
          - "@playwright/test"
          - "playwright"
      # 以下の 3 グループも playwright と同じく「版がずれると壊れる」依存群を束ねる（Issue #119）。
      # グループが無いと minor 更新が依存ごとの PR に分かれ、片方だけ上がる。
      # 実測（2026-09-19, PR #116）: react だけが 19.3.0 に上がり react-dom が 19.2.8 に残って、
      # react-dom の版一致検査（Incompatible React versions）でテストが落ちた。
      # グループ化しても dependabot-automerge.yml はグループ内の依存を 1 件ずつ判定するため、
      # major を含む PR が自動マージされることはない。
      # react-dom は実行時に react と完全一致を要求し、@types/react-dom は peer で @types/react の
      # 同じ minor を要求する。
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # @vitest/coverage-v8 は peer で vitest の完全一致版を要求する。
      vitest:
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
      # @tailwindcss/vite は tailwindcss / @tailwindcss/node / @tailwindcss/oxide を完全一致で依存し、
      # scripts/tailwind-canonical.ts は @tailwindcss/node と @tailwindcss/oxide を直接使う。
      # 版がずれると、ビルドと検査で別々の tailwind が同居する。
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/node"
          - "@tailwindcss/oxide"
          - "@tailwindcss/vite"
      # patch は安全な範囲としてまとめる。minor は個別 PR にして
      # dependabot-automerge.yml が各依存のメジャーバージョンを正しく判定する。
      patch:
        update-types:
          - "patch"

  # ---------------------------------------------------------------------------
  # GitHub Actions（.github/workflows/**）
  # uses: は commit SHA でピン留め運用（pinact）。Dependabot は SHA を更新しつつ
  # 併記したバージョンコメントも追従更新する。
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)" # Actions 更新 -> "ci(deps): ..."
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
