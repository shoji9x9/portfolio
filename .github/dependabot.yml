# Dependabot による依存更新設定。
#
# 注意: mise（mise.toml）で管理するツール
#   node / pnpm / gitleaks / actionlint / ghalint / pinact / shfmt / shellcheck /
#   wrangler / viteplus
# は Dependabot がネイティブに扱えない（対応エコシステムに mise が無いため）。
# これらの更新は `mise outdated` / `mise up` で手動管理し、本設定の対象外とする。
version: 2
updates:
  # ---------------------------------------------------------------------------
  # pnpm 依存（package.json / pnpm-lock.yaml）
  # Dependabot は pnpm を "npm" エコシステムとして解釈する。
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    # Conventional Commits に合わせた commit message prefix。
    commit-message:
      prefix: "chore(deps)" # 本体依存 -> "chore(deps): ..."
      prefix-development: "chore(deps-dev)" # devDependencies -> "chore(deps-dev): ..."
    # サプライチェーン対策: 公開直後のリリース採用を遅延させる
    # （mise の minimum_release_age / pnpm の minimumReleaseAge と方針を揃える）。
    cooldown:
      default-days: 7
    ignore:
      # inter-ui は本文フォントの送り幅を現行サイトと一致させるため 3.19.3 に完全固定している
      # （skills.yml の intentional_diffs.keep「本文フォントの字形・送り幅」）。4.x は字形・
      # メトリクスが変わり、.replace/parity/*/baseline/ のピクセルベースライン（ノイズ基準値は
      # pixel_diff: 0）が無効になる。CI は Playwright を実行しないためこの回帰は検出できない。
      # 上げるには意図的差異レジストリの方針変更とベースライン再採取が要るので、メジャーは出さない。
      - dependency-name: "inter-ui"
        update-types:
          - "version-update:semver-major"
      # @types/node は**意図的に ignore しない**。実行環境（mise.toml の node）と対で上げる
      # 必要がある依存だが、ignore すると Dependabot が沈黙する。mise 管理ツール側の通知は
      # outdated.yml が担うので、両側から通知が来る状態を保ち、整合そのものは CI の
      # `pnpm check:node-version` で機械的に落とす（scripts/node-version-parity.ts。Issue #45）。
      # 検査は「メジャーの一致」と「型の minor が実行環境の minor を超えない」の両方を見る。
      # 後者が要るのは dependabot-automerge.yml が semver-minor を自動マージ対象にしているため
      # （型だけ先の minor へ進むと、実行環境に無い API が型検査を通る。実測は
      # docs/quality-checks.md「3 を等値ではなく片側にする理由」）。
      # 型が先行する PR が来たら単独でマージせず、mise.toml の node 更新を同じ PR に足す。
    groups:
      # playwright 系は**必ず同時に**上げる。片方だけ上げると型検査が壊れる。
      #   - e2e/parity/lib/capture.ts は Locator を "@playwright/test" から取る
      #   - e2e/parity/lib/tools/vendor/trait-capture.mjs は JSDoc の
      #     `import('playwright').Locator` から取る（parity-suite 配布物。修正しない規約）
      #   - capture.ts が前者の値を後者の関数へ渡すため、両者の Locator が同一型である必要がある
      # @playwright/test は playwright を、playwright は playwright-core を厳密固定（^ なし）で
      # 要求するので、版がずれると playwright-core が 2 系統同居し Locator が非互換になる。
      # 実測（2026-08-03, PR #38 / #42）: 片方だけの更新は TS2345 / TS2322 で必ず落ちる。
      # このグループは patch より前に置く（先に一致したグループが採用されるため）。
      # なお、万一片方だけの PR が現れたら**単独でマージしない**。もう片方を同じ PR に足す。
      playwright:
        patterns:
          - "@playwright/test"
          - "playwright"
      # patch は安全な範囲としてまとめる。minor は個別 PR にして
      # dependabot-automerge.yml が各依存のメジャーバージョンを正しく判定する。
      patch:
        update-types:
          - "patch"

  # ---------------------------------------------------------------------------
  # GitHub Actions（.github/workflows/**）
  # uses: は commit SHA でピン留め運用（pinact）。Dependabot は SHA を更新しつつ
  # 併記したバージョンコメントも追従更新する。
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)" # Actions 更新 -> "ci(deps): ..."
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
