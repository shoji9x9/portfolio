name: CI

# PR と main への push で、静的解析・型検査・テスト・ビルド・秘密情報スキャン・
# ライセンス検査を実行する。
# 時間短縮のため、各チェックを GitHub Actions ネイティブの step 並列（parallel:）で実行する。
# 注: actionlint(v1.7.12) は parallel: 構文に未対応のため、.github/actionlint.yaml で
#     ci.yml に限り該当メッセージのみ ignore している（ghalint / pinact は native を許容）。
on:
  push:
    branches:
      - main
  pull_request:

# 最小権限（読み取りのみ）。
permissions:
  contents: read

# 同一 ref の進行中実行はキャンセルして無駄な実行を減らす。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 静的解析 / 型検査 / テスト / ビルド（各チェックをステップ並列で実行）
  # ---------------------------------------------------------------------------
  check:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: true
      # mise.lock（ツールのバージョン・取得 URL・チェックサム・provenance の固定）が
      # mise.toml と食い違っていないかを検査する。mise は install 時に食い違いを見つけると
      # mise.lock を黙って書き換えるため、この差分は「mise.lock のコミット漏れ」を意味する。
      #
      # 実測（2026-08-10 / mise 2026.5.16 linux-x64）:
      #   - mise.toml と mise.lock が整合していれば install 後も mise.lock はバイト単位で不変。
      #   - mise.toml だけ別バージョンにすると install が mise.lock を追従させて書き換える
      #     （lockfile は mise.toml を上書きしない。正は常に mise.toml）。
      #   - ツールが導入済みの場合、mise.lock から platform ブロック（checksum / URL）だけを
      #     削っても install は補完しない。よってこのゲートが捉えるのは**バージョンのずれ**で、
      #     checksum ブロックの欠落は捉えない（`mise lock --platform <plat>` の実行が要る）。
      #   - `--locked` / `MISE_LOCKED=1` は代わりにならない。設定は有効化される
      #     （`mise settings get locked` が true）が、mise.lock に無いツールでも install は成功する。
      #   - 上記は手元の mise 2026.5.16 での実測。CI の mise は mise-action が解決する
      #     未固定バージョン（最新）なので、install の書き戻し挙動が変わればこのゲートは
      #     黙って無力化する。挙動が変わったと疑うときはこの実測をその版で取り直す。
      #
      # 存在検査を先に置く。`git diff -- mise.lock` は **追跡されていないファイルを見ない**ため、
      # mise.lock が未コミット（`git add` 漏れ）でも削除されていても exit 0 になり、
      # 「検査した」というグリーンだけが残る（実測: 未追跡の mise.lock で exit 0）。
      # mise はそもそも存在しない lockfile を維持しないので、追跡漏れはゲートの無力化と同義。
      - name: Verify mise.lock is up to date
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch mise.lock >/dev/null 2>&1; then
            echo "::error file=mise.lock::mise.lock が Git 管理下にありません。ローカルで mise install を実行し、生成された mise.lock を同じコミットに含めてください。"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- mise.lock)" ]; then
            git --no-pager diff -- mise.lock || true
            echo "::error file=mise.lock::mise.lock が mise.toml と整合していません。ローカルで mise install を実行し、mise.lock を同じコミットに含めてください。"
            exit 1
          fi
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 独立した各チェックをステップ並列で実行し、すべて完了したら次へ進む。
      - parallel:
          - name: Verify registry signatures
            run: pnpm audit signatures
          - name: Format check
            run: pnpm run format:check
          - name: Lint
            run: pnpm run lint
          - name: Lint Markdown
            run: pnpm run lint:md
          - name: Lint shell scripts
            run: pnpm run lint:sh
          # 実行環境の Node（mise.toml）と型（@types/node）の整合。3 点を検査する:
          # メジャーの一致 / mise の node が engines.node の下限を満たすこと /
          # @types/node の minor が mise の node の minor を超えないこと。
          # tsc はこれらを見ないため、型だけ上げた PR は他のチェックでは緑になる。
          - name: Node version parity
            run: pnpm run check:node-version
          - name: Knip (unused files / deps)
            run: pnpm run knip
          - name: Copy-paste detection (jscpd)
            run: pnpm run jscpd
          - name: React Doctor
            run: pnpm react:doctor
          - name: Typecheck
            run: pnpm run typecheck
          - name: Test
            run: pnpm run test
          - name: Build
            run: pnpm run build
          - name: License compliance
            run: pnpm run license:check

  # ---------------------------------------------------------------------------
  # 秘密情報スキャン（gitleaks で全履歴を走査）
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 全履歴を対象にするため fetch-depth: 0。
          fetch-depth: 0
          persist-credentials: false
      - name: Set up mise tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: true
      - name: Run gitleaks
        run: gitleaks git --no-banner --redact .
