name: CI

# PR と main への push で、静的解析・型検査・テスト・ビルド・秘密情報スキャン・
# ライセンス検査を実行する。
on:
  push:
    branches:
      - main
  pull_request:

# 最小権限（読み取りのみ）。
permissions:
  contents: read

# 同一 ref の進行中実行はキャンセルして無駄な実行を減らす。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 静的解析 / 型検査 / テスト / ビルド（単一ジョブで直列実行）
  # 呼び出す pnpm script（format:check / lint / lint:md / lint:sh / knip /
  # depcruise / jscpd / doctor / typecheck / test / build）は別担当が package.json
  # に定義する前提。名称が変わる場合はここも追従する。
  # ---------------------------------------------------------------------------
  check:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise で node / pnpm / shellcheck / shfmt などを用意する（mise.toml を読み込む）。
      - name: Set up mise tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: true

      # pnpm store をキャッシュして install を高速化する。
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # サプライチェーン対策: レジストリ署名を検証する（改ざん / なりすまし検出）。
      - name: Verify registry signatures
        run: pnpm audit signatures

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Lint Markdown
        run: pnpm run lint:md

      # シェルスクリプト検査（shellcheck + shfmt -d）。mise 提供の CLI を使う。
      - name: Lint shell scripts
        run: pnpm run lint:sh

      - name: Knip (unused files / deps)
        run: pnpm run knip

      - name: Dependency Cruiser
        run: pnpm run depcruise

      - name: Copy-paste detection (jscpd)
        run: pnpm run jscpd

      - name: React Doctor
        run: pnpm run doctor

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  # ---------------------------------------------------------------------------
  # 秘密情報スキャン（gitleaks で全履歴を走査）
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 全履歴を対象にするため fetch-depth: 0。
          fetch-depth: 0
          persist-credentials: false

      # gitleaks を mise で用意する（mise.toml を読み込む）。
      - name: Set up mise tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: true

      # git 履歴全体をスキャンし、検出値はマスク（--redact）して出力する。
      - name: Run gitleaks
        run: gitleaks git --no-banner --redact .

  # ---------------------------------------------------------------------------
  # 依存ライセンス検査（自前スクリプト scripts/check-licenses.ts）
  # ---------------------------------------------------------------------------
  license:
    name: License compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # node / pnpm を mise で用意する（mise.toml を読み込む）。
      - name: Set up mise tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm licenses list --json` を scripts/check-licenses.ts に渡し、
      # GPL / AGPL / SSPL 等のコピーレフトを含めば fail する。
      - name: Check dependency licenses
        run: pnpm run license:check
