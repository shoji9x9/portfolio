name: CI

# PR と main への push で、静的解析・型検査・テスト・ビルド・秘密情報スキャン・
# ライセンス検査を実行する。
on:
  push:
    branches:
      - main
  pull_request:

# 最小権限（読み取りのみ）。
permissions:
  contents: read

# 同一 ref の進行中実行はキャンセルして無駄な実行を減らす。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 品質チェック（1 ステップ内で shell バックグラウンド並列）
  #   GitHub Actions ネイティブの step 並列（background:/wait-all:）は現行 actionlint
  #   が未対応で actions-lint を壊すため、副作用のない shell 並列（& + wait）で実現する。
  #   各チェックのログを保存し、いずれか失敗でジョブを失敗させる。
  # ---------------------------------------------------------------------------
  check:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: true
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 独立した各チェックを 1 ステップ内でバックグラウンド並列実行する。
      - name: Quality checks (parallel)
        run: |
          set -u
          declare -A PID
          run() {
            local name="$1"
            shift
            ( "$@" ) >"$RUNNER_TEMP/ck-$name.log" 2>&1 &
            PID[$name]=$!
          }
          run audit      pnpm audit signatures
          run format     pnpm run format:check
          run lint       pnpm run lint
          run lint-md    pnpm run lint:md
          run lint-sh    pnpm run lint:sh
          run knip       pnpm run knip
          run depcruise  pnpm run depcruise
          run jscpd      pnpm run jscpd
          run doctor     pnpm run doctor
          run typecheck  pnpm run typecheck
          run test       pnpm run test
          run build      pnpm run build
          run license    pnpm run license:check

          fail=0
          for name in "${!PID[@]}"; do
            if wait "${PID[$name]}"; then
              status="✓"
            else
              status="✗ FAILED"
              fail=1
            fi
            echo "::group::${status} ${name}"
            cat "$RUNNER_TEMP/ck-$name.log"
            echo "::endgroup::"
          done
          exit "$fail"

  # ---------------------------------------------------------------------------
  # 秘密情報スキャン（gitleaks で全履歴を走査）
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 全履歴を対象にするため fetch-depth: 0。
          fetch-depth: 0
          persist-credentials: false
      - name: Set up mise tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: true
      - name: Run gitleaks
        run: gitleaks git --no-banner --redact .
