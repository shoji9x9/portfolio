# shoji9x9/skills 配布物がインストール先で参照するプロジェクト設定。
# 人手で編集可。`gh skill update` はこのファイルに触れないため設定は保持される。
version: 1
skills:
  common:
    # ブランチ運用・commit 規約・Issue タイトル規約の正本ドキュメント。
    # issue-start / pr-review-handle / pr-finalize-loop / dependabot-alert-issue が参照する。
    conventions_doc: AGENTS.md
    # PR 再レビューを依頼する AI レビュアー（pr-review-handle / pr-finalize-loop が共有）。
    review_tool: copilot # copilot | claude-code | codex | none

  dependabot-merge:
    # Dependabot PR のマージ方式。導入時に一度決める。
    merge_method: merge # squash | merge | rebase

  replace-strategy:
    # shoji9x9.github.io を新リポジトリ・Cloudflare へ移行するプロジェクトの設定。
    # 既知の値のみシード。スタック等の計測由来の値や references は `replace-strategy setup` で確定する。
    current: # 現行アプリ（移行元）
      repo: shoji9x9/shoji9x9.github.io
      stack: [Next.js 13, React 18, TypeScript 5, Tailwind CSS 3]
    new: # 新側アプリ（移行先）
      repo: shoji9x9/portfolio
      stack: [Vite 8, React 19, TypeScript 7, Tailwind CSS 4, TanStack Router]
    targets: # 現・新の実行対象環境。各スキルの --target <name> で選択する
      - name: current-prod # 現行の公開サイト（特性化の対象環境。静的サイトのため読み取り専用で扱う）
        side: current
        url: https://shoji9x9.github.io/
        forbidden_actions: # 現行サイトは公開中の静的サイト
          - 現行サイトへの書き込み・変更操作
        default: true
      - name: local-dev # 新側のローカル開発環境（実行系キーは browser-test の同一環境とアンカーで共有）
        side: new
        url: &local-dev-url http://localhost:5173
        forbidden_actions: [] # 空リスト = すべて実施可（未定義 = 読み取り専用とは意味が異なる）
        start: &local-dev-start pnpm dev # 稼働していないときだけ実行する（稼働判定は check_urls）
        check_urls: &local-dev-check-urls
          - http://localhost:5173/
        default: true
      - name: local-production # 新側のローカル本番相当（build 成果物を preview サーバーで配信。実行系キーは browser-test と共有）
        side: new
        url: &local-production-url http://localhost:4173
        forbidden_actions: []
        pre_commands: &local-production-pre-commands # サーバー稼働の有無に依らず毎回 build する（start は未稼働時のみ実行のため）
          - pnpm build
        start: &local-production-start pnpm preview # build は pre_commands が担う（pnpm start だと build が二重になる）
        check_urls: &local-production-check-urls
          - http://localhost:4173/
      - name: preview # Cloudflare Pages のプレビュー環境（デプロイ固有 URL: https://<デプロイ ID 先頭 8 桁>.shoji9x9.pages.dev）
        side: new
        # URL がデプロイごとに変わるため固定値を書けない。wrangler に現ブランチの最新プレビューデプロイを
        # 問い合わせて 1 行で返す（wrangler の --json はブランチ alias を返さないため、デプロイ固有 URL を使う。
        # 検証の途中で別デプロイへすり替わらない点で alias より確実）。
        # プレビューは PR 作成時にのみデプロイされるため、PR 作成前のブランチでは解決できず停止する。
        url_command: node scripts/preview-url.mjs
        forbidden_actions: # 共有のデプロイ環境（インターネット公開）のため書き込み系は行わない
          - プレビュー環境への書き込み・変更操作
      - name: production # Cloudflare Pages の本番環境。デプロイ開始後に commit_check / on_diff の追加を検討する
        side: new
        url: https://shoji9x9.pages.dev/
        forbidden_actions: # 公開後は本番サイトとして扱う
          - 本番サイトへの書き込み・変更操作
    parity_suite_dir: e2e/ # パリティスイートの配置（parity-suite が読む）
    dataset_tool_dir: seed/ # golden-dataset の投入ツールの配置先
    # ゴールデンデータセットの実体。本プロジェクトは DB を持たない静的サイトのため static を選ぶ
    # （db では投入先 target に db.seedable を要求し、フェーズ A の再実行がデッドロックする）。
    dataset_mode: static
    dataset_static_paths: # 投入ツールが生成・削除してよい範囲。この配下以外へ書いたら停止する
      - seed/data/ # フェーズ A: 現行ソースから起こした正本データの生成先
    verification_commands: # 完了前に実行する検証コマンド列（parity-replace が読む）
      - pnpm typecheck
      - pnpm lint
    artifacts:
      retention: latest
      storage: local
      size_threshold_mb: 50
      overrides: {}
    intentional_diffs: # 意図的差異レジストリ
      keep:
        - 公開ルート（/）と単一ページのセクション順
        - プロフィール、バッジ、職務経歴、製作物、静的テキストの内容
        - 既存の外部リンク先
        - 読み取り専用の公開サイトとしての振る舞い
      may_change:
        # UI コンポーネントは変更予定。ライブラリ変更に伴うコンポーネントレベルの機能・見た目の差異は許容する。
        - UI コンポーネントの実装・見た目（shadcn/ui 等への移行に伴う差異）
        - HTML の id/name とコンポーネント内部構造
      pending:
        - LAPRAS プレビューをビルド時に取得するか、Cloudflare Worker 実行時に取得するか
        - LAPRAS プレビュー取得失敗時の表示とキャッシュ方針
    component_diffs: [] # コンポーネント系統差レジストリ（parity-replace が宣言）
    component_diff_exceptions: [] # インスタンス単位の例外（parity-diff が宣言）

  # dependabot-alert-issue:
  #   リポジトリ固有の alert 特別処理（dismiss ルール等）が必要になったらここに記述する。
  #   現時点では規約は common.conventions_doc に従う。

  browser-test:
    environments:
      # url / pre_commands / start / check_urls は replace-strategy.targets の同一環境のアンカーを参照
      # （auth は型が異なるためエントリ全体は共有しない。片側だけの変更は両スキルに影響する点に注意）
      - name: local
        url: *local-dev-url
        auth: none
        start: *local-dev-start
        check_urls: *local-dev-check-urls
        default: true
        forbidden_actions: []
      - name: local-production
        url: *local-production-url
        auth: none
        pre_commands: *local-production-pre-commands # サーバー稼働の有無に依らず毎回 build する（start はサーバー未稼働時のみ実行のため）
        start: *local-production-start # build は pre_commands が担う（pnpm start だと build が二重になる）
        check_urls: *local-production-check-urls
        forbidden_actions: []
