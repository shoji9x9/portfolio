# shoji9x9/skills 配布物がインストール先で参照するプロジェクト設定。
# 人手で編集可。`gh skill update` はこのファイルに触れないため設定は保持される。
version: 1
skills:
  common:
    # ブランチ運用・commit 規約・Issue タイトル規約の正本ドキュメント。
    # issue-start / pr-review-handle / pr-finalize-loop / dependabot-alert-issue が参照する。
    conventions_doc: AGENTS.md
    # PR 再レビューを依頼する AI レビュアー（pr-review-handle / pr-finalize-loop が共有）。
    review_tool: copilot # copilot | claude-code | codex | none

  dependabot-merge:
    # Dependabot PR のマージ方式。導入時に一度決める。
    merge_method: merge # squash | merge | rebase

  replace-strategy:
    # shoji9x9.github.io を新リポジトリ・Cloudflare へ移行するプロジェクトの設定。
    # 既知の値のみシード。スタック等の計測由来の値や references は `replace-strategy setup` で確定する。
    current: # 現行アプリ（移行元）
      repo: shoji9x9/shoji9x9.github.io
      stack: [Next.js 13, React 18, TypeScript 5, Tailwind CSS 3]
    new: # 新側アプリ（移行先）
      repo: shoji9x9/portfolio
      stack: [Vite 8, React 19, TypeScript 7, Tailwind CSS 4, TanStack Router]
    targets: # 現・新の実行対象環境。各スキルの --target <name> で選択する
      - name: current-prod # 現行の公開サイト（特性化の対象環境。静的サイトのため読み取り専用で扱う）
        side: current
        url: https://shoji9x9.github.io/
        forbidden_actions: # 現行サイトは公開中の静的サイト
          - 現行サイトへの書き込み・変更操作
        default: true
      - name: local-dev # 新側のローカル開発環境（実行系キーは browser-test の同一環境とアンカーで共有）
        side: new
        url: &local-dev-url http://localhost:5173
        forbidden_actions: [] # 空リスト = すべて実施可（未定義 = 読み取り専用とは意味が異なる）
        start: &local-dev-start pnpm dev # 稼働していないときだけ実行する（稼働判定は check_urls）
        check_urls: &local-dev-check-urls
          - http://localhost:5173/
        default: true
      - name: local-production # 新側のローカル本番相当（build 成果物を preview サーバーで配信。実行系キーは browser-test と共有）
        side: new
        url: &local-production-url http://localhost:4173
        forbidden_actions: []
        # v1.30.1 以降、pre_commands は check_urls が落ちたときだけ実行される。
        # ソース変更後は稼働中の preview を停止してから検証し、この build を必ず通す。
        pre_commands: &local-production-pre-commands
          - pnpm build
        start: &local-production-start pnpm preview # build は未稼働時の pre_commands が担う
        check_urls: &local-production-check-urls
          - http://localhost:4173/
      - name: preview # Cloudflare Pages のプレビュー環境（デプロイ固有 URL: https://<デプロイ ID 先頭 8 桁>.shoji9x9.pages.dev）
        side: new
        # URL がデプロイごとに変わるため固定値を書けない。wrangler に現ブランチの最新プレビューデプロイを
        # 問い合わせて 1 行で返す（wrangler の --json はブランチ alias を返さないため、デプロイ固有 URL を使う。
        # 検証の途中で別デプロイへすり替わらない点で alias より確実）。
        # プレビューは PR 作成時にのみデプロイされるため、PR 作成前のブランチでは解決できず停止する。
        url_command: node scripts/preview-url.mjs
        forbidden_actions: # 共有のデプロイ環境（インターネット公開）のため書き込み系は行わない
          - プレビュー環境への書き込み・変更操作
      - name: production # Cloudflare Pages の本番環境。デプロイ開始後に commit_check / on_diff の追加を検討する
        side: new
        url: https://shoji9x9.pages.dev/
        forbidden_actions: # 公開後は本番サイトとして扱う
          - 本番サイトへの書き込み・変更操作
    parity_suite_dir: e2e/ # パリティスイートの配置（parity-suite が読む）
    dataset_tool_dir: seed/ # golden-dataset の投入ツールの配置先
    # ゴールデンデータセットの実体。本プロジェクトは DB を持たない静的サイトのため static を選ぶ
    # （db では投入先 target に db.seedable を要求し、フェーズ A の再実行がデッドロックする）。
    dataset_mode: static
    dataset_static_paths: # 投入ツールが生成・削除してよい範囲。この配下以外へ書いたら停止する
      - seed/data/ # フェーズ A: 現行ソースから起こした正本データの生成先
      - src/data/ # フェーズ B: 新側の静的データ形式へ写像した生成先（スキーマは src/data/types.ts）
    uses_storage: false # アップロード先・ファイル出力先となるストレージは使わない静的サイト
    references: # スキル群が読むプロジェクト知識の配置
      architecture: docs/architecture.md # 新側アーキテクチャの決定記録（parity-replace が実装前に読む）
      ui_library: "" # 新 UI ライブラリと旧→新 design token 対応。未整備を明示する
      # static モードにおける「静的データ形式の対応と意味論差」。golden-dataset のフェーズ B が
      # 写像設計と現新一致検証で読む（db モードの DB 意味論に相当するもの）。
      db_semantics: .replace/references/static-data-semantics.md
      env_setup: "" # 環境変数の用意方法。未整備を明示する
      dependency_policy: docs/dependency-policy.md
    verification_commands: # 完了前に実行する検証コマンド列（parity-replace が読む）
      - pnpm typecheck
      - pnpm lint
    artifacts:
      retention: latest
      storage: local
      size_threshold_mb: 50
      overrides: {}
    intentional_diffs: # 意図的差異レジストリ
      keep:
        - 公開ルート（/）と単一ページのセクション順
        # 2026-08-04（Issue #31）で「プロフィール、バッジ、職務経歴、製作物、静的テキストの内容」を
        # keep から外した。移行（#22 / #23）が収束し本番へ切り替わったあとのコンテンツ更新は、
        # 現行を追従させずに新側だけを変えるため（下記 may_change「移行完了後のコンテンツ更新」）。
        # 移行時点で内容が一致していたことは .replace/parity/ の成果物が証跡として残す。
        - 公開ルート（/）で表示するセクションの構成（プロフィール・アカウント・自己PR・保有スキル・職務経歴詳細・資格・製作物・希望条件・LAPRAS）
        - 既存の外部リンク先（下記 may_change のコンテンツ更新で差し替えたものを除く）
        - 読み取り専用の公開サイトとしての振る舞い
        # 2026-07-29 決定。現行 / はヘッダー・ナビ・フッターを持たない単一ページで、新側もそれに合わせる。
        # Issue #4 で作った AppShell は / へ適用せず、コードごと削除した（git 履歴から復元可能）。
        - ヘッダー・ナビゲーション・フッターを持たない単一ページ構成
        # 2026-07-29 決定。本文フォントは現行と同じ Inter 3.019・ヒンティング無しのビルドを使う
        # （npm パッケージ inter-ui@3.19.3）。実測で送り幅が現行と全サンプル一致する。
        # 経緯と原因調査は .replace/parity/static-page/gaps.md「フォント差の原因調査」を参照。
        - >-
          本文フォントの字形・送り幅:
          現行と同じ Inter 3.019・ヒンティング命令なしのビルドを使い、送り幅を一致させる
          （サブセットのビルドは別で、weight 600 のラスタライズのみ数画素違う。下記 pending）
      may_change:
        # UI コンポーネントは変更予定。ライブラリ変更に伴うコンポーネントレベルの機能・見た目の差異は許容する。
        - UI コンポーネントの実装・見た目（shadcn/ui 等への移行に伴う差異）
        - HTML の id/name とコンポーネント内部構造
        # 以下 3 件は static-page の parity-replace（2026-07-28）で新側に入れ、2026-07-29 に許容と決定した。
        - >-
          セクション・カードのランドマーク化（新側のみ）:
          現行は role を持たない div。新側は section + aria-labelledby（role=region）、
          プロジェクト／製作物カードは article + aria-labelledby（role=article）。
          支援技術でセクション・カード単位に移動できるようになる
        - >-
          外部リンクへの rel="noreferrer" 付与（新側のみ）:
          現行は target="_blank" のみ。表示・リンク先は変わらず、リンク先が参照元を受け取らなくなる
        - >-
          技術スタックのデータ不整合時の失敗の仕方（新側のみ）:
          現行は未知のバッジキーで壊れた画像を 1 個出す。新側は該当バッジだけを落として
          console.warn を出す（ページ全体は表示され続ける）
        # GitHub の綴りの是正（2026-07-28 決定）。現行は Github / GithubActions / logo=Github だが、
        # 新側は公式表記へ揃える。ゴールデンデータセットは現行の実値を保持したままにし
        # （フェーズ A は現行を忠実に再現する契約のため）、新側の期待値はパリティスイートの
        # 意図的差異層 `e2e/parity/lib/intentional-diffs.ts` が side ごとに解決する。
        - >-
          GitHub の綴りの是正（新側のみ）:
          バッジ表示名 Github → GitHub /
          バッジ表示名 GithubActions → GitHub Actions（語の区切りも公式表記へ）/
          アカウントバッジ画像 URL のクエリ logo=Github → logo=GitHub
        # PR #25 の Copilot レビュー指摘を採用して追加（2026-07-29 にユーザー承認）。
        # 差分器では検出されない（computed style にも aria スナップショットにも現れず、
        # role は両側とも columnheader）。上の 2 件と同じ「新側のみの安全側・アクセシビリティ改善」。
        - >-
          プロフィール表の th への scope="col" 付与（新側のみ）:
          現行は scope を持たない。列見出しであることを明示する（WCAG H63）。
          表示・role は変わらない
        # Issue #23（2026-07-31）でユーザー承認。現行のビルド時取得から、
        # Cloudflare Pages Function によるLAPRAS公開ページの実行時取得へ変更する。
        - >-
          LAPRAS プレビューの取得時点（新側のみ）:
          Cloudflare Pages Function の GET /api/lapras-preview が実行時にLAPRAS公開ページをHTTPSで呼び、
          検証済みのOGメタデータを Cloudflare Cache API へ24時間保存する。
          現行は静的エクスポートのビルド時取得で、更新には再ビルドが必要
        - >-
          LAPRAS プレビュー取得失敗時のフォールバック（新側のみ）:
          API は公開ページの取得失敗・不正メタデータを安全な固定 503 JSON にし、
          UI はセクションを残して画像を隠し、LAPRAS 公開プロフィールへのテキストリンクを表示する。
          現行は明示的な失敗表示を持たない
        # Issue #31（2026-08-04）でユーザー承認。移行（#22 / #23）の収束後に入れるコンテンツ更新で、
        # 現行 shoji9x9.github.io は追従させない。これにより seed/data（ゴールデンデータセットの
        # フェーズ A）の役割が「現行の忠実な再現」から「ポートフォリオの正本」へ変わる。
        # 影響: パリティスイートの current project は以後 green にならない（期待値を正本から引くため）。
        # 移行時点の一致は .replace/parity/ の成果物が証跡として残し、以後の回帰検証は新側同士で行う。
        - >-
          移行完了後のコンテンツ更新（新側のみ）:
          2023年10月以降のフリーランス4案件を職務経歴詳細へ追加、自己PRを現行の1項目＋職務経歴書由来の3項目へ刷新、
          製作物「ポートフォリオ」を新リポジトリー（shoji9x9/portfolio）・新URL（https://shoji9x9.pages.dev/）へ差し替えて記事を削除、
          技術バッジを10件追加（保有スキルセクションの表示も増える）
        # 上のコンテンツ更新に伴う構造の変更。記事を持たない製作物が初めて生まれたため。
        - >-
          製作物カードの「記事」見出しの省略（新側のみ）:
          現行は全製作物が記事を持ち、常に「記事」見出しとリンクを描画する。
          新側は article を任意項目とし、持たない製作物では見出しごと描画しない
      pending: []
    component_diffs: # コンポーネント系統差レジストリ（parity-replace が宣言）
      # 2026-07-29、static-page の parity-diff 反復 1 で検出した系統差。
      # いずれも実体は同じだが値の表現が変わるもので、クラス/トークン単位で 1 回宣言すれば
      # 全インスタンスに効く。parity-diff はこの宣言からの逸脱だけを回帰候補として浮かせる。
      - component: 本文フォント（全要素）
        property: font-family
        current: "__Inter_e66fe9, __Inter_Fallback_e66fe9"
        new: '"Inter var", "Inter Fallback"'
        reason: >-
          現行は next/font がフォント名をハッシュ付きで生成する。新側は自分で @font-face を書くため
          名前が変わる。指すフォントは同じ Inter 3.019 でどちらもヒンティング命令（prep）を持たず、
          送り幅は 18 サンプルすべてで実測一致する。ただしサブセットのビルドは別で
          （現行は gasp テーブルを持ち inter-ui は持たない）、weight 600 のラスタライズだけ
          数画素違う（この画素差はここでは吸収されない。下記 pending を参照）
  # dependabot-alert-issue:
  #   リポジトリ固有の alert 特別処理（dismiss ルール等）が必要になったらここに記述する。
  #   現時点では規約は common.conventions_doc に従う。

  browser-test:
    environments:
      # url / pre_commands / start / check_urls は replace-strategy.targets の同一環境のアンカーを参照
      # （auth は型が異なるためエントリ全体は共有しない。片側だけの変更は両スキルに影響する点に注意）
      - name: local
        url: *local-dev-url
        auth: none
        start: *local-dev-start
        check_urls: *local-dev-check-urls
        default: true
        forbidden_actions: []
      - name: local-production
        url: *local-production-url
        auth: none
        pre_commands: *local-production-pre-commands # 稼働中 preview は停止後に検証し、確実に build する
        start: *local-production-start # build は未稼働時の pre_commands が担う
        check_urls: *local-production-check-urls
        forbidden_actions: []
