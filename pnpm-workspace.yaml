# pnpm のワークスペース / サプライチェーン設定。
# 依存パッケージ経由の攻撃対策として、ビルドスクリプト実行を許可制にし、
# 公開直後の新しすぎるバージョンの採用を遅延させる。

# postinstall 等のビルドスクリプトを実行してよい依存を明示的に許可する（既定は全ブロック）。
# 信頼できるツールのみ true にする。
allowBuilds:
  esbuild: true
  lefthook: true

# 公開から一定時間を経ていないバージョンを採用しない（悪意あるリリースの取り下げ猶予）。
# 単位は「分」。10080 分 = 7 日。mise の minimum_release_age と揃える。
# 方針: 例外（minimumReleaseAgeExclude）は使わない。ゲートに引っかかる依存は
# 成熟版へ張り替える（範囲を緩めて pnpm に成熟版を選ばせる）か、成熟版が無ければ採用を見送る。
minimumReleaseAge: 10080
