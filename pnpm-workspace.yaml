# pnpm のワークスペース / サプライチェーン設定。
# 依存パッケージ経由の攻撃対策として、ビルドスクリプト実行を許可制にし、
# 公開直後の新しすぎるバージョンの採用を遅延させる。

# postinstall 等のビルドスクリプトを実行してよい依存を明示的に許可する（既定は全ブロック）。
# 信頼できるツールのみ true にする。
allowBuilds:
  esbuild: true
  lefthook: true

# 公開から一定時間を経ていないバージョンを採用しない（悪意あるリリースの取り下げ猶予）。
# 単位は「分」。10080 分 = 7 日。mise の minimum_release_age と揃える。
# 方針: 例外（minimumReleaseAgeExclude）は使わない。ゲートに引っかかる依存は
# 成熟版へ張り替える（範囲を緩めて pnpm に成熟版を選ばせる）か、成熟版が無ければ採用を見送る。
minimumReleaseAge: 10080

# vite は Vite+ core のエイリアス（package.json の `vite` =
# npm:@voidzero-dev/vite-plus-core@<mise の viteplus と同一版>）。エイリアス先の版は
# 0.3.1 のような Vite+ の版なので、@vitejs/plugin-react 等が要求する peer 範囲
# （vite: ^8.0.0 など）は構造上満たせない。実際の互換性は Vite+ が同梱する vite の版が
# 担保するため、この peer 不一致だけを無効化する（理由・実測は
# docs/dependency-policy.md「vite は Vite+ core のエイリアスで管理する」）。
#
# 無効化は `vite: "*"` ではなく **要求元ごと**に書く。`vite: "*"` だと今後追加する
# パッケージの vite peer 不一致まで黙って通り、判断の機会が消える。要求元を列挙しておけば
# 未登録の要求元を持つパッケージが入ったときだけ検出される。`pnpm install` は警告だけで exit 0 に
# なるため、判定は CI の `pnpm peers check`（ci.yml の check ジョブ）が担う（実測 2026-09-21 / pnpm 11.26.0:
# 下記 5 件で `pnpm peers check` が clean、1 件（@vitejs/plugin-react）を抜くと
# `unmet peer vite / Installed: 0.3.1 / Wanted: ^8.0.0` で exit 1）。
# 対象を増やすときは `pnpm peers check` の出力にある要求元をここへ足す。
peerDependencyRules:
  allowedVersions:
    "@rolldown/plugin-babel>vite": "*"
    "@tailwindcss/vite>vite": "*"
    "@vitejs/plugin-react>vite": "*"
    "@vitest/mocker>vite": "*"
    "vitest>vite": "*"
