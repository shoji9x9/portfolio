# mise で管理するツール。`mise install` で導入する。
# バージョンは再現性のため厳密にピン留めする（更新は Dependabot / mise up で行う）。
#
# 解決結果（取得 URL・チェックサム・provenance）は mise.lock に固定してコミットする。
# ここを変更したら `mise install` を実行して mise.lock を追従させ、同じコミットに含めること
# （CI の "Verify mise.lock is up to date" が食い違いを検出して失敗する）。
# 対象プラットフォームを増やすときは `mise lock --platform <plat>` で採取する。
[tools]
# ランタイム / パッケージマネージャ
node = "26.11.1"
# pnpm 12 系は Dependabot 側の上流修正を確認して採用した（2026-10-19、Issue #163）。過去に 2 回見送った経緯と
# マージ後の確認手順は docs/dependency-policy.md「pnpm 12 系の採用経緯」。
pnpm = "12.12.1"

# セキュリティ / lint（シェル・GitHub Actions）
gitleaks = "8.30.1"
actionlint = "1.7.12"
ghalint = "1.5.6"
pinact = "5.0.0"
shfmt = "3.14.1"
shellcheck = "0.11.0"

# Cloudflare CLI
wrangler = { version = "4.149.0", allow_builds = ["esbuild", "sharp", "workerd"] }

# vite+（vite / vitest / oxlint / oxfmt などを内包）。
# 0.3.1 以降、vp dev / build / preview は node_modules/vite が
# @voidzero-dev/vite-plus-core@<ここと同一版> であることを厳密一致で要求する。
# package.json の `vite` はそのエイリアスなので、ここを上げたら同じコミットで同じ版へ揃える
# （理由・実測は docs/dependency-policy.md「vite は Vite+ core のエイリアスで管理する」）。
viteplus = "1.1.0"

# TypeScript 言語サーバ（エージェントのコード知能用。.github/lsp.json が参照）。
# プロジェクトのビルド用 TypeScript v7 とは別系統（本パッケージは自前の tsserver を使う）。
"npm:typescript-language-server" = "6.0.2"

[settings]
# サプライチェーン対策: 公開直後の新しすぎるリリースを採用しない（悪意あるリリースの取り下げ猶予）。
# ツール解決・更新時にこの日数を経ていないバージョンを避ける。
minimum_release_age = "7 days"
